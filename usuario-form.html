<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo usuário - Sistema Acadêmico</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1 id="titulo-sistema">Sistema de Gerenciamento Acadêmico</h1>
    <nav>
      <a href="index.html">Início</a>
      <a id="link-alunos" href="alunos.html">Alunos</a>
      <a href="cursos.html">Cursos</a>
      <a href="matriculas.html">Matrículas</a>
      <a href="usuarios.html">Usuários</a>
    </nav>
  </header>
  <main>
    <h2>Cadastrar usuário</h2>
    <form id="form-usuario">
      <div><label for="nome">Nome</label><input id="nome" type="text" required></div>
      <div><label for="perfil">Perfil</label><select id="perfil"><option value="administrador">Administrador</option><option value="secretaria">Secretaria</option><option value="professor">Professor</option></select></div>
      <div><label for="status">Status</label><select id="status"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></div>
      <button type="submit">Cadastrar usuário</button>
      <p id="mensagem-form" role="status"></p>
    </form>
    <h2>Usuários cadastrados</h2>
    <div id="lista-usuarios" class="lista-grid"></div>
  </main>
  <footer>Programação Web I - Aula 11 - JSON e LocalStorage</footer>
  <script src="js/dados.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
