<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alunos - Sistema Acadêmico</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1 id="titulo-sistema">Sistema de Gerenciamento Acadêmico</h1>
    <nav>
      <a href="index.html">Início</a>
      <a id="link-alunos" href="alunos.html">Alunos</a>
      <a href="cursos.html">Cursos</a>
      <a href="matriculas.html">Matrículas</a>
      <a href="usuarios.html">Usuários</a>
    </nav>
  </header>
  <main>
    <h2>Alunos</h2>
    <p>Total de alunos: <strong id="total-alunos">0</strong></p>
    <div class="filtros">
      <div><label for="busca">Buscar aluno</label><input id="busca" type="search" placeholder="Digite o nome"></div>
      <div><label for="filtro-status">Status</label><select id="filtro-status"><option value="">Todos</option><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></div>
      <button type="button" id="btn-atualizar">Atualizar lista</button>
      <button type="button" id="btn-restaurar-alunos" class="secundario">Restaurar dados iniciais</button>
    </div>
    <div id="lista-alunos" class="lista-grid"></div>
    <section id="detalhes-aluno" class="card">
      <h2>Detalhes do Aluno</h2>
      <p id="detalhe-nome"></p><p id="detalhe-curso"></p><p id="detalhe-status"></p>
    </section>
    <h2>Novo aluno</h2>
    <form id="form-aluno">
      <div><label for="nome">Nome</label><input id="nome" type="text" required></div>
      <div><label for="email">E-mail</label><input id="email" type="email" required></div>
      <div><label for="curso">Curso</label><select id="curso"><option value="ADS">ADS</option><option value="CC">Ciência da Computação</option></select></div>
      <div><label for="status">Status</label><select id="status"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></div>
      <button type="submit">Cadastrar aluno</button>
      <p id="mensagem-form" role="status"></p>
    </form>
  </main>
  <footer>Programação Web I - Aula 11 - JSON e LocalStorage</footer>
  <script src="js/dados.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
